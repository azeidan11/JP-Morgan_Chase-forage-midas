# Point everything at the embedded Kafka broker that Spring Kafka Test starts
spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers}
spring.kafka.consumer.bootstrap-servers=${spring.embedded.kafka.brokers}
spring.kafka.producer.bootstrap-servers=${spring.embedded.kafka.brokers}
spring.kafka.admin.properties.bootstrap.servers=${spring.embedded.kafka.brokers}

# Consumer basics for deterministic test replays
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.consumer.group-id=midas-core-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

# JSON de/serialization
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# If your tests consume a specific type, you can set it explicitly.
# Uncomment and set the correct class if needed:
# spring.kafka.consumer.properties.spring.json.value.default.type=com.jpmc.midascore.model.Transaction